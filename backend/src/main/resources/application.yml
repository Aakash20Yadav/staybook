# Staybook API configuration.
# No credentials live in this file. Values come from environment variables,
# or from an optional backend/.env file (git-ignored). See .env.example.
spring:
  application:
    name: staybook-api
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hotel_booking?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:hotel_app}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_batch_fetch_size: 50
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never

app:
  # Hotels operate in this zone; "today" for date validation is computed here.
  timezone: ${APP_TIMEZONE:Asia/Kolkata}
  currency: INR
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  booking:
    max-nights: 30
    max-days-in-advance: 365
